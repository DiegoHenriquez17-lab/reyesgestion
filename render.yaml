services:
  - type: web
    name: reyes-gestion-pruebas
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm db:migrar && pnpm db:seed && pnpm start --hostname 0.0.0.0
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: '24.14.0'
      - key: APP_ENTORNO
        value: desarrollo
      - key: REGISTRO_INICIAL_WEB
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MAX_CONEXIONES
        value: '5'
      - key: DATABASE_IDLE_TIMEOUT_SEGUNDOS
        value: '120'
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: reyes-documentos
      - key: AI_PROVEEDOR_PRINCIPAL
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SEED_ADMIN_NOMBRE
        value: Administración
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
